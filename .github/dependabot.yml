version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date (the version
  # is in the comment next to each pin). Review the PRs it opens.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
