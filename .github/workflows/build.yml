name: Build PauloVPN
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go 1.20
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        
    - name: Build VPN Core (Intel)
      run: |
        git clone -b v1.4.5 https://github.com/SagerNet/sing-box.git core-build
        cd core-build
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../sing-box ./cmd/sing-box
        
    - name: Compile App (Objective-C Intel)
      run: |
        mkdir -p AirVPN.app/Contents/MacOS AirVPN.app/Contents/Resources
        echo "APPL????" > AirVPN.app/Contents/PkgInfo
        cp Info.plist AirVPN.app/Contents/Info.plist
        cp sing-box AirVPN.app/Contents/Resources/sing-box
        
        # МАГИЯ: Берем красивую встроенную иконку Замка из самой macOS!
        cp /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/LockIcon.icns AirVPN.app/Contents/Resources/AppIcon.icns
        
        chmod +x AirVPN.app/Contents/Resources/sing-box
        
        clang -fobjc-arc -framework Cocoa main.m AppDelegate.m ViewController.m \
          -arch x86_64 -mmacosx-version-min=10.13 \
          -o AirVPN.app/Contents/MacOS/AirVPN
          
        codesign --force --deep -s - AirVPN.app
        zip -r PauloVPN-macOS-10.13-v1.9.zip AirVPN.app
        
    - name: Release version
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: "PauloVPN ${{ github.ref_name }}"
        body: "Релиз v1.9.\n- Полностью удален ImageMagick для ускорения сборки.\n- Использована нативная иконка macOS (Замок).\n- Повышена стабильность."
        files: PauloVPN-macOS-10.13-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
