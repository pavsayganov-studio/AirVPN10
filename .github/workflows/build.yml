name: Build macOS 10.13 GUI VPN
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go 1.20
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
    - name: Build VPN Core
      run: |
        git clone -b v1.4.5 https://github.com/SagerNet/sing-box.git core-build
        cd core-build
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../sing-box ./cmd/sing-box
    - name: Compile App (Objective-C)
      run: |
        mkdir -p AirVPN.app/Contents/MacOS AirVPN.app/Contents/Resources
        cp Info.plist AirVPN.app/Contents/Info.plist
        cp sing-box AirVPN.app/Contents/Resources/sing-box
        chmod +x AirVPN.app/Contents/Resources/sing-box
        
        # Компилируем все файлы Objective-C
        clang -fobjc-arc -framework Cocoa main.m AppDelegate.m ViewController.m -o AirVPN.app/Contents/MacOS/AirVPN -target x86_64-apple-macosx10.13
        
        zip -r AirVPN-macOS-10.13.zip AirVPN.app
    - name: Release to GitHub
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: "AirVPN with GUI for macOS 10.13"
        files: AirVPN-macOS-10.13.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
