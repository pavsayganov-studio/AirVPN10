name: Build PauloVPN
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go 1.20
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
    - name: Build VPN Core (Intel + uTLS)
      run: |
        git clone -b v1.4.5 https://github.com/SagerNet/sing-box.git core-build
        cd core-build
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags with_utls -trimpath -ldflags="-s -w" -o ../sing-box ./cmd/sing-box
    - name: Compile App (Objective-C Intel)
      run: |
        mkdir -p AirVPN.app/Contents/MacOS AirVPN.app/Contents/Resources
        echo "APPL????" > AirVPN.app/Contents/PkgInfo
        cp Info.plist AirVPN.app/Contents/Info.plist
        cp sing-box AirVPN.app/Contents/Resources/sing-box
        
        # Скачиваем официальную иконку
        curl -sL https://github.com/SagerNet/sing-box/raw/main/docs/assets/icon.icns -o AirVPN.app/Contents/Resources/AppIcon.icns || true
        
        chmod +x AirVPN.app/Contents/Resources/sing-box
        
        clang -fobjc-arc -framework Cocoa main.m AppDelegate.m ViewController.m \
          -arch x86_64 -mmacosx-version-min=10.13 \
          -o AirVPN.app/Contents/MacOS/AirVPN
          
        codesign --force --deep -s - AirVPN.app
        # Имя файла теперь динамическое (v3.1 и т.д.)
        zip -r "PauloVPN-macOS-10.13-${{ github.ref_name }}.zip" AirVPN.app
    - name: Release version
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: "PauloVPN ${{ github.ref_name }} (System Proxy + Zombie Killer)"
        body: "Официальный релиз.\n- ИСПРАВЛЕНА ошибка 'address already in use'.\n- Ядро корректно убивается от имени Root.\n- Исправлены имена zip-архивов."
        files: PauloVPN-macOS-10.13-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
