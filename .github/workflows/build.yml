name: Build PauloVPN
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go 1.20
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build sing-box core
      run: |
        git clone --depth=1 -b v1.8.11 https://github.com/SagerNet/sing-box.git core-build
        cd core-build
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
          go build \
            -tags "with_utls,with_grpc,with_reality" \
            -trimpath \
            -ldflags="-s -w" \
            -o ../sing-box \
            ./cmd/sing-box

    - name: Compile macOS app
      run: |
        mkdir -p AirVPN.app/Contents/MacOS
        mkdir -p AirVPN.app/Contents/Resources

        echo "APPL????" > AirVPN.app/Contents/PkgInfo
        cp Info.plist AirVPN.app/Contents/Info.plist

        cp sing-box AirVPN.app/Contents/Resources/sing-box
        chmod +x AirVPN.app/Contents/Resources/sing-box

        # Компилируем с SystemConfiguration (нужен для SCDynamicStoreCopyProxies)
        clang \
          -fobjc-arc \
          -framework Cocoa \
          -framework SystemConfiguration \
          -arch x86_64 \
          -mmacosx-version-min=10.13 \
          -o AirVPN.app/Contents/MacOS/AirVPN \
          main.m AppDelegate.m ViewController.m

        codesign --force --deep -s - AirVPN.app
        zip -r "PauloVPN-macOS-10.13-${{ github.ref_name }}.zip" AirVPN.app

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: "PauloVPN ${{ github.ref_name }}"
        body: |
          ## PauloVPN ${{ github.ref_name }}

          ### Что нового в v0.6
          - ✅ Telegram: дополнительный SOCKS5 на порту 10810 + deep link одним кликом
          - ✅ Watchdog: автообнаружение падения ядра, сброс прокси без пароля
          - ✅ Панель настройки Telegram прямо в интерфейсе
          - ✅ Убраны selector/urltest группы из конфига — нет фоновых пингов
          - ✅ Telegram IP больше не в direct — Telegram работает через VPN
          - ✅ Shell injection protection — эскейпинг путей
          - ✅ Лог перезаписывается при старте (не растёт бесконечно)
          - ✅ Пароль только когда реально нужен

          ### Telegram
          Нажми кнопку "📱 Настройка Telegram" в приложении.
        files: PauloVPN-macOS-10.13-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
